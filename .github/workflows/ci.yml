# Tests WireRoute on every push. macOS runs locally (npm run e2e); CI covers
# Linux and Windows, where Windows runs the real installer and all Chrome
# suites against fake WireGuard servers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logic:
    name: Rules, PAC and config parsing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  helper:
    name: Helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go vet ./...
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then go test -race -count=1 ./...; else go test -count=1 ./...; fi

  chrome-windows:
    name: Chrome end-to-end (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Features
        run: node test/e2e/run.js
      - name: Browsing like a person
        if: success() || failure()
        run: node test/e2e/browse.js
      - name: Breaking things on purpose
        if: success() || failure()
        run: node test/e2e/breakit.js
      - name: Every button
        if: success() || failure()
        run: node test/e2e/buttons.js
      - name: Helper log
        if: failure()
        shell: bash
        run: cat "$LOCALAPPDATA/WireRoute/Logs/helper.log" || true

  windows-zip:
    name: Windows download
    runs-on: ubuntu-latest
    needs: [logic, helper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: ./tools/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WireRoute-windows
          path: dist/WireRoute-windows-*/
